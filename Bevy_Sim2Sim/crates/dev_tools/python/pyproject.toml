[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "bevy-microduck-tools"
version = "0.1.10"
description = "Content-addressed MicroDuck source adoption, raw capture, and qualification tools"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
# Reuse the adopted MicroDuck toolchain family, without its actuator model.
# CPU 3.13 diagnostics are separate from this upstream training environment.
goose_training = [
    "mjlab==1.3.0",
    "mujoco==3.10.0",
    "mujoco-warp==3.8.1",
    "warp-lang==1.12.0",
    "rsl-rl-lib==5.0.1",
    "gymnasium==1.2.3",
    "torch==2.9.1",
    "scipy>=1.16",
]

[project.scripts]
bevy-microduck = "bevy_microduck_tools.cli:main"
bevy-microduck-profile = "bevy_microduck_tools.profile_discovery:main"

[tool.uv.build-backend]
module-name = "bevy_microduck_tools"

[tool.uv.sources]
# PyPI's Linux aarch64 Torch wheel lacks CUDA; DGX Spark uses the CUDA wheel.
torch = [
    { index = "pytorch_cu129", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch_cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
