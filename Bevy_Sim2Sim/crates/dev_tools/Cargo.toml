[package]
name = "dev_tools_minigame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
g1_constraint_diagnostic = ["simulation_minigame/g1_constraint_diagnostic"]
g1_source_lighting = ["rendering_preview", "bevy/pbr_light_textures"]
sim2sim_observation = ["simulation_minigame/sim2sim_observation"]
sim2sim_limit_row_trace = ["sim2sim_observation", "simulation_minigame/sim2sim_limit_row_trace"]
sim2sim_plain_mass_probe = ["sim2sim_observation", "simulation_minigame/sim2sim_plain_mass_probe"]
sim2sim_source_limit_probe = ["sim2sim_limit_row_trace", "simulation_minigame/sim2sim_source_limit_probe"]
rendering_preview = ["dep:rendering_minigame", "dep:bevy", "task_minigame/ui"]
live_physics_profile = ["rapier3d/profiler"]
live_render_profile = ["rendering_preview", "dep:libc"]

[dependencies]
common_minigame.workspace = true
robot_minigame.workspace = true
simulation_minigame.workspace = true
task_minigame.workspace = true
rendering_minigame = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }
rapier3d.workspace = true
ort.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[[bin]]
name = "g1_visual_policy_probe"
path = "src/bin/g1_visual_policy_probe.rs"
required-features = ["rendering_preview"]

[[bin]]
name = "g1_visual_decision_probe"
path = "src/bin/g1_visual_decision_probe.rs"
required-features = ["rendering_preview"]

[[bin]]
name = "robot_initialization_preview"
path = "src/bin/robot_initialization_preview.rs"
required-features = ["rendering_preview"]

[[bin]]
name = "station_robot_60hz_diagnostic"
path = "src/bin/station_robot_60hz_diagnostic.rs"
required-features = ["rendering_preview"]

[[bin]]
name = "station_robot_live_preview"
path = "src/bin/station_robot_live_preview.rs"
required-features = ["rendering_preview"]

[[bin]]
name = "robot_pose_sequence_video"
path = "src/bin/robot_pose_sequence_video.rs"
required-features = ["rendering_preview"]

[[bin]]
name = "v8_geology_contact_probe"
path = "src/bin/v8_geology_contact_probe.rs"
required-features = ["rendering_preview"]

[[bin]]
name = "paired_force_probe"
path = "src/bin/paired_force_probe.rs"
required-features = ["sim2sim_observation"]

[[bin]]
name = "contact_platform_probe"
path = "src/bin/contact_platform_probe.rs"
required-features = ["sim2sim_observation"]

[[bin]]
name = "source_limit_continuous_probe"
path = "src/bin/source_limit_continuous_probe.rs"
required-features = ["sim2sim_source_limit_probe"]
