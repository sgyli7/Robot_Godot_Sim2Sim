[package]
name = "simulation_minigame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
g1_constraint_diagnostic = ["rapier3d/g1-predictive-limits"]
g1_contact_point_diagnostic = ["g1_constraint_diagnostic"]
sim2sim_observation = ["rapier3d/sim2sim-observation"]
sim2sim_limit_row_trace = ["sim2sim_observation", "rapier3d/sim2sim-limit-row-trace"]
sim2sim_motor_row_trace = ["sim2sim_observation", "rapier3d/sim2sim-motor-row-trace"]
sim2sim_plain_mass_probe = ["sim2sim_observation", "rapier3d/sim2sim-plain-mass-probe"]
sim2sim_source_limit_probe = ["sim2sim_limit_row_trace", "rapier3d/sim2sim-source-limit-probe"]

[dependencies]
common_minigame.workspace = true
robot_minigame.workspace = true
task_minigame.workspace = true
bevy_ecs.workspace = true
rapier3d.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
